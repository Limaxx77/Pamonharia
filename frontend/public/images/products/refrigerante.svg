    <rect x="407" y="182" width="146" height="30" rx="12" fill="url(#top)"/>
    <rect x="395" y="350" width="170" height="70" fill="#426B35" opacity=".92"/>
    <circle cx="480" cy="385" r="22" fill="#FFF8E8"/>
  </g>
  <g>
    <rect x="590" y="250" width="170" height="340" rx="24" fill="url(#canC)"/>

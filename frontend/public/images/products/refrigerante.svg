<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-label="Ilustração: latas de refrigerante com gelo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF8E8"/>
      <stop offset="1" stop-color="#F6E6C0"/>
    </linearGradient>
    <linearGradient id="canA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2F5226"/><stop offset=".45" stop-color="#5B8A47"/><stop offset="1" stop-color="#2F5226"/>
    </linearGradient>
    <linearGradient id="canB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B8871A"/><stop offset=".45" stop-color="#F5C542"/><stop offset="1" stop-color="#B8871A"/>
    </linearGradient>
    <linearGradient id="canC" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5A381B"/><stop offset=".45" stop-color="#9A6A3E"/><stop offset="1" stop-color="#5A381B"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9AA0A6"/><stop offset=".5" stop-color="#E8EAED"/><stop offset="1" stop-color="#9AA0A6"/>
    </linearGradient>
  </defs>
  <rect width="960" height="720" fill="url(#bg)"/>
  <ellipse cx="480" cy="610" rx="340" ry="36" fill="#754C29" opacity=".16"/>
  <g>
    <rect x="200" y="250" width="170" height="340" rx="24" fill="url(#canA)"/>
    <rect x="212" y="232" width="146" height="30" rx="12" fill="url(#top)"/>
    <rect x="200" y="380" width="170" height="70" fill="#FFF8E8" opacity=".9"/>

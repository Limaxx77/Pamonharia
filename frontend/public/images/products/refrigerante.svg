    <rect x="760" y="560" width="55" height="45" rx="10" transform="rotate(14 787 582)"/>
    <circle cx="250" cy="300" r="6"/><circle cx="455" cy="270" r="7"/><circle cx="520" cy="470" r="5"/><circle cx="700" cy="320" r="6"/>
